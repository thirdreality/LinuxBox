display_alert "Common settings for Thirdreality Linuxbox Armbian OS images" "setting default values" "info"
#declare -g USE_MAINLINE_GOOGLE_MIRROR="yes"

# tests
#APT_MIRROR="ftp.si.debian.org/debian/"
#LEGACY_DEBOOTSTRAP=yes
declare -g SYNC_CLOCK="no"
declare -g INSTALL_HEADERS="no"
declare -g WIREGUARD="no"
declare -g VENDOR="Armbian"
declare -g VENDORURL="https://3reality.com/"
declare -g VENDORDOCS="https://3reality.com/user-manuals/"
declare -g VENDORSUPPORT="https://discuss.3reality.com/"
declare -g VENDORPRIVACY="https://www.armbian.com"
declare -g VENDORBUGS="https://www.armbian.com/bugs"
declare -g VENDORLOGO="armbian-logo"
declare -g MAINTAINERMAIL="support@3reality.com"
declare -g MAINTAINER="Thirdreality Dev"
declare -g COMPRESS_OUTPUTIMAGE="sha,pgp,img,xz"
declare -g IMAGE_XZ_COMPRESSION_RATIO=8
declare -g EXPERT="yes"
declare -g KERNEL_CONFIGURE=no


#declare -g PASTE_URL="https://paste.armbian.de/log"
# Set Docker base image based on board requirements
if [[ $BOARD == odroidxu4 || $BOARD == bananapif3 || $BOARD == musepipro || $BOARD == numaker-iot-ma35d16f90 ]]; then
	declare -g DOCKER_ARMBIAN_BASE_IMAGE="ubuntu:noble"
elif [[ $BOARD == uefi-loong64 || $BOARD == radxa-nio-12l || $BOARD == radxa-dragon-q6a || $BOARD == qcom-robotics-rb5 ]]; then
	# loongarch or UFS use debian:trixie
	declare -g DOCKER_ARMBIAN_BASE_IMAGE="debian:trixie"
else
	declare -g DOCKER_ARMBIAN_BASE_IMAGE="ubuntu:jammy"
fi

declare -g INSTALL_ARMBIAN_FIRMWARE="no"

declare -g ROOTPWD="shushi16888"

#declare -g DONT_BUILD_ARTIFACTS="firmware,full_firmware,fake_ubuntu_advantage_tools,armbian-zsh,armbian-plymouth-theme"
declare -g DONT_BUILD_ARTIFACTS="fake_ubuntu_advantage_tools,armbian-config,armbian-zsh,armbian-plymouth-theme"

#declare -g OCI_TARGET_BASE="ghcr.io/jethome-iot/armbian-os/"
declare -g PREFER_DOCKER="yes"
