<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root to own the supervisor service -->
  <policy user="root">
    <allow own="com.thirdreality.linuxbox.Supervisor"/>
    <allow send_destination="com.thirdreality.linuxbox.Supervisor"/>
    <allow send_interface="com.thirdreality.linuxbox.Supervisor"/>
  </policy>

  <!-- Allow any user to call supervisor methods -->
  <policy context="default">
    <allow send_destination="com.thirdreality.linuxbox.Supervisor"/>
    <allow send_interface="com.thirdreality.linuxbox.Supervisor"/>
    <allow receive_sender="com.thirdreality.linuxbox.Supervisor"/>
  </policy>
</busconfig>
