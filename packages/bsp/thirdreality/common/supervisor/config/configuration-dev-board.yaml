# LinuxBox Supervisor Configuration File - Development Board Variant
# This is an example configuration for a development board with different GPIO layout
# Copy to /var/lib/hubv3-supervisor/configuration.yaml to use

version: 1


# ============================================================================
# Hardware Configuration (GPIO Pins) - Custom for Dev Board
# ============================================================================
# This overrides the default GPIO configuration from config.h

hardware:
  # LED GPIO Configuration (same as production board)
  led:
    red:
      chip: "gpiochip1"
      line: 3
    green:
      chip: "gpiochip0"
      line: 4
    blue:
      chip: "gpiochip0"
      line: 5
  
  # Button GPIO Configuration (DIFFERENT - on gpiochip1 line 11)
  button:
    chip: "gpiochip1"
    line: 11


# ============================================================================
# System Information Configuration
# ============================================================================
system_info:
  # Release information files
  release_files:
    t3r: "/etc/t3r-release"
    armbian: "/etc/armbian-release"
  
  # Device name prefixes based on board type
  device_prefixes:
    trhubv3: "3RHUB-"
    trhubv3a: "3RHUB-"
    trhubv3b: "3RCARE-"
    default: "3RHUB-"
  

# ============================================================================
# Software Package Configuration
# ============================================================================
# Defines software packages to query and their version mapping keys

software_packages:
  # Home Assistant packages
  - package: "thirdreality-hacore-config"
    key: "config"
    
  - package: "thirdreality-python3"
    key: "python3"
    
  - package: "thirdreality-hacore"
    key: "hacore"
    required: true
    
  - package: "thirdreality-otbr-agent"
    key: "otbr-agent"
    
  - package: "thirdreality-zigbee-mqtt"
    key: "zigbee-mqtt"
    required: true
    
  - package: "thirdreality-music-assistant"
    key: "music-assistant"

# ... (rest of configuration same as default)


# ============================================================================
# BLE Provisioning Configuration
# ============================================================================
ble:
  provisioning_timeout: 300    # 5 minutes
  adapter: "hci0"              # BlueZ adapter name


# ============================================================================
# Zigbee2MQTT Configuration
# ============================================================================
zigbee2mqtt:
  data_path: "/opt/zigbee2mqtt/data"
  config_file: "configuration.yaml"
  default_template: "/lib/thirdreality/conf/configuration_blz.yaml.default"
