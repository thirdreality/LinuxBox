# TRHub V3 Amlogic A113X quad core 2Gb RAM SoC, eMMC 8/32Gb
BOARD_NAME="TRHub-V3B"
HOST="linuxbox-hubv3b"
BOARDFAMILY="trhub"
BOOTCONFIG="trhub_v3b_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
# WiFi modules (aml_sdio + vlsicomm) are loaded by amlogicw1.service
# (w1_start.sh) after boot, not via systemd-modules-load. Loading them early
# races the SDIO power-on/probe and can block ~90s on a cold-boot timing
# failure, so no MODULES_CURRENT override is set here.
#PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker libprotobuf-lite32 python3-pip python3-dev python3.11-venv python3-aiohttp python3-gi python3-dbus  python3-gi-cairo gir1.2-gtk-3.0watchdog ca-certificates cifs-utils libnfs13 curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 tzdata libjemalloc2 libavahi-client3 libavahi-common3 libflac12 libogg0 libopus0 libsoxr0 libvorbis0a libvorbisenc2"
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker libprotobuf-lite32 python3-pip python3-dev python3.11-venv python3-aiohttp python3-gi python3-dbus  python3-gi-cairo gir1.2-gtk-3.0 watchdog ca-certificates cifs-utils libnfs13 curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 tzdata libjemalloc2 libavahi-client3 libavahi-common3 libmosquitto1 mosquitto"
PACKAGE_LIST_BOARD_REMOVE="chrony resolvconf openvpn network-manager-openvpn unattended-upgrades"
PACKAGE_LIST_RM="armbian-zsh"
DEFAULT_CONSOLE="serial"
HAS_VIDEO_OUTPUT="no"