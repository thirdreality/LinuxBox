# TRHub V3 Amlogic A113X quad core 2Gb RAM SoC, eMMC 8/32Gb
BOARD_NAME="TRHub-V3B"
BOARDFAMILY="trhub"
BOOTCONFIG="trhub_v3_defconfig"
KERNEL_TARGET="current,edge"
# Only preload the low-level SDIO layer (aml_sdio) at early boot. The main WiFi
# driver (vlsicomm) is loaded later by amlogicw1.service (w1_start.sh), because
# vlsicomm's init triggers the SDIO power-on/probe which can block for ~90s in
# systemd-modules-load on a cold-boot SDIO timing failure.
MODULES_CURRENT="aml_sdio"
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker libprotobuf-lite32 python3-pip python3-dev python3.11-venv python3-aiohttp watchdog ca-certificates cifs-utils curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 libnfs-dev libmosquitto1 mosquitto"
#PACKAGE_LIST_BOARD_REMOVE="chrony resolvconf build-essential cpp-12 gcc-12 automake autoconf autotools-dev binutils binutils-aarch64-linux-gnu binutils-common:arm64 openvpn network-manager-openvpn"
PACKAGE_LIST_BOARD_REMOVE="chrony resolvconf openvpn network-manager-openvpn"
DEFAULT_CONSOLE="serial"
BOOT_LOGO="no"

