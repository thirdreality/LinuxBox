# TRHub V3 Amlogic A113X quad core 1Gb RAM SoC, eMMC 8G
BOARD_NAME="LinuxBox"
BOARDFAMILY="trhub"
BOOTCONFIG="trhub_linuxbox_defconfig"
KERNEL_TARGET="current,edge"
# WiFi modules (aml_sdio + vlsicomm) are loaded by amlogicw1.service
# (w1_start.sh) after boot, not via systemd-modules-load. Loading them early
# races the SDIO power-on/probe and can block ~90s on a cold-boot timing
# failure, so no MODULES override is set here.
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker libprotobuf-lite32 python3-pip python3-dev python3.11-venv python3-aiohttp watchdog ca-certificates cifs-utils curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 libnfs-dev ffmpeg jemalloc snapcast mosquitto"
PACKAGE_LIST_BOARD_REMOVE="chrony resolvconf unattended-upgrades"
DEFAULT_CONSOLE="serial"
BOOT_LOGO="no"

