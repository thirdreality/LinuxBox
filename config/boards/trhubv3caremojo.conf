# TRHub V3 Amlogic A113X quad core 2Gb RAM SoC, eMMC 8/32Gb
#
# CareMojo partner image. Identical hardware to trhubv3 (BOOTCONFIG, family,
# kernel, U-Boot are the same); only the rootfs payload differs -- the
# CareMojo watch-offload stack is baked in by customize-image.sh instead of
# being installed by hand on every box.
#
# Build:
#   ./make-armbian-build-release.sh -b hubv3caremojo -d us -r <version>
#
# The image carries no credentials. Per-Hub identity (device-auth.env), the
# cloud env file and the tailscale authkey are injected at the factory, not
# here -- see docs/CAREMOJO_IMAGE.md.
BOARD_NAME="TRHub-V3"
BOARDFAMILY="trhub"
HOST="linuxbox-hubv3"
BOOTCONFIG="trhub_v3_defconfig"
# Same U-Boot as trhubv3: u-boot-cmkey rebuilds from these board patches.
BOOTBRANCH="tag:v2023.10"
BOOTPATCHDIR="v2023.10"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
MODULES=""
# WiFi modules (aml_sdio + vlsicomm) are loaded by amlogicw1.service
# (w1_start.sh) after boot, not via systemd-modules-load. Loading them early
# races the SDIO power-on/probe and can block ~90s on a cold-boot timing
# failure, so no MODULES_CURRENT override is set here.
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker libprotobuf-lite32 python3-pip python3-dev python3.11-venv python3-aiohttp watchdog ca-certificates cifs-utils curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 libjsoncpp25 tzdata libjemalloc2 avahi-daemon libavahi-client3 libavahi-common3 alsa-utils iptables"
PACKAGE_LIST_BOARD_REMOVE="chrony resolvconf openvpn network-manager-openvpn unattended-upgrades"
PACKAGE_LIST_RM="armbian-zsh"
DEFAULT_CONSOLE="serial"
HAS_VIDEO_OUTPUT="no"
BOOT_LOGO="no"
