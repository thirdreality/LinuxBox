# TRHub V3 Amlogic A113X quad core 2Gb RAM SoC, eMMC 8/32Gb
BOARD_NAME="TRHub-V3"
BOARDFAMILY="trhub"
HOST="linuxbox-hubv3"
BOOTCONFIG="trhub_v3_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
# Only preload the low-level SDIO layer (aml_sdio) at early boot. The main WiFi
# driver (vlsicomm) is loaded later by amlogicw1.service (w1_start.sh), because
# vlsicomm's init triggers the SDIO power-on/probe which can block for ~90s in
# systemd-modules-load on a cold-boot SDIO timing failure.
MODULES_CURRENT="aml_sdio"
#PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker libprotobuf-lite32 python3-pip python3-dev python3.11-venv python3-aiohttp python3-gi python3-dbus  python3-gi-cairo gir1.2-gtk-3.0watchdog ca-certificates cifs-utils libnfs13 curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 tzdata libjemalloc2 libavahi-client3 libavahi-common3 libflac12 libogg0 libopus0 libsoxr0 libvorbis0a libvorbisenc2"
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker libprotobuf-lite32 python3-pip python3-dev python3.11-venv python3-aiohttp watchdog ca-certificates cifs-utils curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 libjsoncpp25 tzdata libjemalloc2 avahi-daemon libavahi-client3 libavahi-common3 libmosquitto1 mosquitto"
PACKAGE_LIST_BOARD_REMOVE="chrony resolvconf openvpn network-manager-openvpn unattended-upgrades"
PACKAGE_LIST_RM="armbian-zsh"
DEFAULT_CONSOLE="serial"
HAS_VIDEO_OUTPUT="no"