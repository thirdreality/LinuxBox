# TRHub V3A Amlogic A113X quad core 512MB/1GB RAM SoC, eMMC, no ttyAML6 (Thread UART), uart_AO_B
# # 3R-LinuxBOx_MA v0.1 2022.11.11
BOARD_NAME="TRHub-V3A"
HOST="linuxbox-hubv3a"
BOARDFAMILY="trhub"
BOOTCONFIG="trhub_v3_defconfig"
BOOT_FDT_FILE="amlogic/meson-axg-thirdreality-trhub-v3a.dtb"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
# WiFi modules (aml_sdio + vlsicomm) are loaded by amlogicw1.service
# (w1_start.sh) after boot, not via systemd-modules-load. Loading them early
# races the SDIO power-on/probe and can block ~90s on a cold-boot timing
# failure, so no MODULES_CURRENT override is set here.
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools dbus-broker python3-pip python3-dev python3.11-venv python3-aiohttp watchdog ca-certificates cifs-utils curl dbus jq libglib2.0-bin lsb-release network-manager nfs-common systemd-journal-remote systemd-resolved udisks2 wget systemd-timesyncd ipset iputils-arping iputils-ping libturbojpeg0 libcjson1 tzdata libjemalloc2 avahi-daemon libavahi-client3 libavahi-common3"
PACKAGE_LIST_BOARD_REMOVE="chrony resolvconf openvpn network-manager-openvpn unattended-upgrades"
PACKAGE_LIST_RM="armbian-zsh"
DEFAULT_CONSOLE="serial"
HAS_VIDEO_OUTPUT="no"
