# Separate /boot partition (mounted read-only at runtime) to protect the
# boot-critical files (kernel / DTB / initrd / boot.scr) from filesystem
# corruption caused by unclean power loss or by the boot button (which is
# multiplexed onto eMMC DAT5) being pressed while the device is running.
# The boot partition is never written during normal operation, so its
# filesystem metadata cannot be damaged. Kernel/boot updates therefore
# require re-flashing the full image (appliance model).
BOOTFS_TYPE="ext4"
BOOTSIZE="128" # MiB - must match the 'boot' size in partition_arm.dtsi

