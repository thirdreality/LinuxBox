			"$destination/var/lib/hubv3-supervisor/" || exit_with_error "Unable to copy supervisor conf directory"

		# 从 config 目录复制 static/（web UI）
		run_host_command_logged cp -r -v "$SRC/packages/bsp/thirdreality/common/supervisor/config/static" \
			"$destination/var/lib/hubv3-supervisor/" || exit_with_error "Unable to copy supervisor static directory"
	fi

	# 安装 D-Bus 策略配置
	run_host_command_logged mkdir -p "$destination/etc/dbus-1/system.d" || exit_with_error "Unable to mkdir /etc/dbus-1/system.d"
	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/supervisor/config/dbus/com.thirdreality.linuxbox.Supervisor.conf" \
		"$destination/etc/dbus-1/system.d/" || exit_with_error "Unable to copy com.thirdreality.linuxbox.Supervisor.conf"

	# 安装 supervisor 可执行文件到 /usr/local/bin，并赋予执行权限
	run_host_command_logged mkdir -p "$destination/usr/local/bin" || exit_with_error "Unable to mkdir /usr/local/bin"
	run_host_command_logged install -m 755 "$SRC/packages/bsp/thirdreality/common/supervisor/supervisor" \
		"$destination/usr/local/bin/supervisor" || exit_with_error "Unable to install supervisor binary"

	# 安装 systemd unit 到 /etc/systemd/system
	run_host_command_logged mkdir -p "$destination/etc/systemd/system" || exit_with_error "Unable to mkdir /etc/systemd/system"
	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/supervisor/supervisor.service" \
		"$destination/etc/systemd/system/supervisor.service" || exit_with_error "Unable to copy supervisor.service"	

	# Log rotation
	run_host_command_logged mkdir -p --mode=755 "$destination/etc/rsyslog.d" || exit_with_error "Unable to mkdir /etc/rsyslog.d"
	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/60-armbian-logs-rotate.conf" "$destination/etc/rsyslog.d/" || exit_with_error "Unable to copy 60-armbian-logs-rotate.conf"
	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/armbian-remove-log-file.sh" "$destination/usr/lib/armbian/" || exit_with_error "Unable to copy armbian-remove-log-file.sh"
	run_host_command_logged chmod -v a+x "$destination/usr/lib/armbian/armbian-remove-log-file.sh" || exit_with_error "Unable to set armbian-remove-log-file.sh script mode"

	# HubV3 factory-reset
	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/hubv3-factory-reset.service" "$destination/lib/systemd/system/" || exit_with_error "Unable to copy hubv3-factory-reset.service"

	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/factory-reset.sh" "$destination/usr/lib/armbian/" || exit_with_error "Unable to copy factory-reset.sh"
	run_host_command_logged chmod -v a+x "$destination/usr/lib/armbian/factory-reset.sh" || exit_with_error "Unable to set factory-reset.sh script mode"

	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/factory-reset-supervised.sh" "$destination/usr/lib/armbian/" || exit_with_error "Unable to copy factory-reset-supervised.sh"
	run_host_command_logged chmod -v a+x "$destination/usr/lib/armbian/factory-reset-supervised.sh" || exit_with_error "Unable to set factory-reset-supervised.sh script mode"

	run_host_command_logged mkdir -p "$destination/etc/udev/rules.d"
	run_host_command_logged cp -v "$SRC/packages/bsp/thirdreality/common/supervisor/config/udev/33-ama-usb.rules" \
		"$destination/etc/udev/rules.d/" || exit_with_error "Unable to copy 33-ama-usb.rules"

	run_host_command_logged mkdir -p "$destination/usr/local/bin"
}
