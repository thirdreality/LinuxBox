write_uboot_platform() {
	local unable_install_uboot="Unable to install U-Boot."
	local method=0

	if [[ "$2" == *mmcblk* ]]; then
		local mmcblk_prefix
		mmcblk_prefix=$(echo "$2" | grep -Po "mmcblk\d")
		logger "${FUNCNAME[0]}(): mmcblk_prefix = $mmcblk_prefix"

		if [[ -n "$mmcblk_prefix" ]]; then
			local mmc_boot=${mmcblk_prefix}boot
			local of_boot0=/dev/${mmc_boot}0
			local of_boot1=/dev/${mmc_boot}1
			if [[ -e $of_boot0 ]]; then
				method=1
				logger "${FUNCNAME[0]}(): use install in boot emmc partitions"
			fi
		else
			logger "${FUNCNAME[0]}(): mmcblk_prefix is empty. $unable_install_uboot"
			return 1
		fi
	else
		logger "${FUNCNAME[0]}(): use standart u-boot install."
	fi

	dd if="$1/u-boot.bin" of="$2" bs=1 count=442 conv=fsync > /dev/null 2>&1
	dd if="$1/u-boot.bin" of="$2" bs=512 skip=1 seek=1 conv=fsync > /dev/null 2>&1

	if [[ $method == 1 ]]; then
		logger "${FUNCNAME[0]}(): of_boot0 = $of_boot0"
		logger "${FUNCNAME[0]}(): of_boot1 = $of_boot1"

		# unset force-read-only flag
		echo 0 > "/sys/block/${mmc_boot}0/force_ro"
		echo 0 > "/sys/block/${mmc_boot}1/force_ro"
		logger "${FUNCNAME[0]}(): /sys/block/${mmc_boot}0/force_ro value after unsetting read-only flag: $(< "/sys/block/${mmc_boot}0/force_ro")"
		logger "${FUNCNAME[0]}(): /sys/block/${mmc_boot}1/force_ro value after unsetting read-only flag: $(< "/sys/block/${mmc_boot}1/force_ro")"

		local uboot_name=u-boot.bin
		local uboot_size_in_kbytes=$(($(stat --printf "%s" "$1/$uboot_name") / 1024))
		local uboot_offset=1 # 512 bytes in dd
		logger "${FUNCNAME[0]}(): uboot_size_in_kbytes = $uboot_size_in_kbytes"
		logger "${FUNCNAME[0]}(): uboot_offset = $uboot_offset"
		dd if="$1/u-boot.bin" of="$of_boot0" bs=512 skip=1 conv=fsync > /dev/null 2>&1
		dd if="$1/u-boot.bin" of="$of_boot1" bs=512 skip=1 conv=fsync > /dev/null 2>&1
	fi

	logger "${FUNCNAME[0]}(): u-boot successfulley installed"
}

comment_default_rsyslog_rules() {
	local conf_file="$SDCARD/etc/rsyslog.d/50-default.conf"

	if [[ ! -f "${conf_file}" ]]; then
		display_alert "Can't find rsyslog default config at ${conf_file}" "${RELEASE}" "wrn"
		return 2
	fi

	local rule_file_arr=(/var/log/syslog /var/log/auth.log /var/log/kern.log /var/log/mail.log /var/log/mail.err)

	rule_file_escaped_arr=("${rule_file_arr[@]}")
	for ((i = 0; i < ${#rule_file_escaped_arr[*]}; i++)); do
		rule_file_escaped_arr[$i]="${rule_file_arr[$i]//\//\\/}"
	done

	for ((i = 0; i < ${#rule_file_escaped_arr[*]}; i++)); do
		rule_file_escaped="${rule_file_escaped_arr[$i]}"
		regexp="^[^#][^ \t]+[ \t]+.?${rule_file_escaped}.*$"
		if grep -Pq "$regexp" "$conf_file"; then
			sed -i -E -e "s/$regexp/#\0/g" "$conf_file" || {
				echo "sed 's/$regexp/#\0/g' $conf_file failed"
				return 1
			}
		else
			echo "grep '$regexp' $conf_file failed"
			return 2
		fi
	done
}

# ============================================================================
# Make the kernel actually accept /lib/firmware/regulatory.db.
#
# Symptom this fixes (present on every boot up to and including v2.14.01.45):
#   cfg80211: loaded regulatory.db is malformed or signature is missing/invalid
#
# Cause: Debian's wireless-regdb ships the database twice, signed by two
# different keys, and registers both through update-alternatives:
#
#   /lib/firmware/regulatory.db-debian     priority 100   <- auto-selected
#   /lib/firmware/regulatory.db-upstream   priority  50
#
# The two .db payloads are byte-identical; only the detached .p7s signatures
# differ. Verified on both versions seen in our apt cache:
#   2025.07.10  db sha256 872b1654f84b09d7...  (both copies)  p7s 1118 vs 1085 bytes
#   2026.05.30  db sha256 2fb33ca0074db573...  (both copies)  p7s 1118 vs 1085 bytes
#
# Our kernel is built from upstream source, so net/wireless/certs/ contains
# only sforshee.hex and wens.hex, and CONFIG_CFG80211_EXTRA_REGDB_KEYDIR is
# empty -- Debian's signing key is not among them. Combined with
# CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=y the kernel rejects the database and
# silently falls back to its built-in world-roaming domain, which constrains
# channels and TX power more than the real country rules would.
# README.Debian documents exactly this case and prescribes the switch below.
#
# Because the two payloads are identical, switching changes only which
# signature gets verified -- it cannot alter any regulatory rule.
#
# --set (rather than --auto) is deliberate: it pins the choice as manual so an
# apt upgrade of wireless-regdb cannot hand us back the Debian-signed copy.
# Our kernel will never trust that key. To undo:
#   update-alternatives --auto regulatory.db
#
# Ordering: wireless-regdb lands in the base rootfs as a wpasupplicant
# dependency, long before family_tweaks() runs, so the alternative is already
# registered by the time we get here.
# ============================================================================
select_upstream_regulatory_db() {
	local db_upstream="/lib/firmware/regulatory.db-upstream"
	local p7s_upstream="/lib/firmware/regulatory.db.p7s-upstream"

	if [[ ! -f "${SDCARD}${db_upstream}" || ! -f "${SDCARD}${p7s_upstream}" ]]; then
		display_alert "wireless-regdb upstream copy absent, kernel will keep rejecting regulatory.db" "${BOARD}" "wrn"
		return 2
	fi

	chroot_sdcard update-alternatives --set regulatory.db "${db_upstream}" || {
		echo "update-alternatives --set regulatory.db ${db_upstream} failed"
		return 1
	}

	# Verify the master link and its .p7s slave both moved. update-alternatives
	# builds a two-level link, so compare the raw target of the /etc/alternatives
	# entry -- resolving with readlink -f from the host would escape $SDCARD and
	# follow the build machine's own /lib/firmware instead.
	local db_target p7s_target
	db_target="$(readlink "${SDCARD}/etc/alternatives/regulatory.db" 2> /dev/null)"
	p7s_target="$(readlink "${SDCARD}/etc/alternatives/regulatory.db.p7s" 2> /dev/null)"

	if [[ "${db_target}" != "${db_upstream}" || "${p7s_target}" != "${p7s_upstream}" ]]; then
		echo "regulatory.db alternative did not switch: db='${db_target}' p7s='${p7s_target}'"
		return 1
	fi

	display_alert "regulatory.db pinned to upstream-signed copy" "${BOARD}" "info"
}

# Mount the separate /boot partition read-only at runtime.
# The framework (partitioning.sh) writes an fstab entry like:
#   UUID=... /boot ext4 defaults,commit=30,errors=remount-ro 0 2
# We rewrite the options to 'ro' so boot-critical files can never be
# written (and therefore never corrupted) during normal operation.
# Note: this only affects the target image fstab; the build host mounts
# /boot rw while assembling the image, so initramfs generation still works.
format_partitions__trhub_boot_ro() {
	local fstab="$SDCARD/etc/fstab"
	[[ ! -f "$fstab" ]] && return 0
	if grep -qE '^\S+\s+/boot\s+ext4\s+' "$fstab"; then
		display_alert "Setting /boot to read-only in fstab" "${BOARD}" "info"
		sed -i -E 's#^(\S+\s+/boot\s+ext4\s+)\S+#\1ro,noatime#' "$fstab"
	fi
}

