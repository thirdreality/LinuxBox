# ============================================================================
# Install every LinuxBox Supervisor asset. Single entry point on purpose: the
# copies used to be scattered across family_tweaks_bsp, which is how the udev
# rules ended up 30 lines away from the rest and got missed during review.
#
# SOURCE layout — produced by package.sh in the LinuxBox_Supervisor repo and
# dropped verbatim into packages/bsp/thirdreality/common/supervisor/:
#
#   supervisor/
#   |-- install.sh                        device-side installer, NOT used here
#   |-- supervisor                        aarch64 binary
#   |-- supervisor.service
#   `-- config/
#       |-- configuration.yaml            fallback; per-board copy wins
#       |-- configuration-dev-board.yaml  dev boards only, not shipped
#       |-- conf/zigbee2mqtt/{configuration.yaml,mosquitto.conf}
#       |-- dbus/com.thirdreality.linuxbox.Supervisor.conf
#       |-- static/{index.html,css/,js/}
#       `-- udev/33-ama-usb.rules
#
# TARGET layout — must stay in sync with install.sh and with the --html and
# --config paths in supervisor.service:
#
#   /usr/local/bin/supervisor
#   /etc/systemd/system/supervisor.service
#   /var/lib/hubv3-supervisor/configuration.yaml
#   /var/lib/hubv3-supervisor/conf/
#   /usr/share/hubv3-supervisor/static/
#   /etc/dbus-1/system.d/com.thirdreality.linuxbox.Supervisor.conf
#   /etc/udev/rules.d/33-ama-usb.rules
#
# install.sh is deliberately NOT executed at build time: it targets a live
# device (interactive prompt, systemctl start, udevadm trigger, dbus reload)
# and none of that works inside the build chroot. This function mirrors its
# file layout, so the two must be updated together.
#
# supervisor.service itself is enabled separately, in family_tweaks(), because
# that has to run inside the chroot.
# ============================================================================
install_supervisor_assets() {
	local destination="$1"
	local pkg_dir="$SRC/packages/bsp/thirdreality/common/supervisor"
	local tarball="$pkg_dir/supervisor-${SUPERVISOR_VERSION}-aarch64.tar.gz"
	local board_conf="$SRC/packages/bsp/thirdreality/${BOARD}/supervisor/configuration.yaml"
	local tmp_dir src

	# --- 1. unpack the release tarball -------------------------------------
	[[ -f "$tarball" ]] || exit_with_error "Supervisor tarball not found (check SUPERVISOR_VERSION)" \
		"supervisor-${SUPERVISOR_VERSION}-aarch64.tar.gz"

	run_host_command_logged mkdir -p "${SRC}/.tmp" || exit_with_error "Unable to mkdir .tmp"
	tmp_dir="$(mktemp -d "${SRC}/.tmp/supervisor-XXXXXX")" || exit_with_error "Unable to create temp dir for supervisor"

	display_alert "Unpacking supervisor" "${SUPERVISOR_VERSION}" "info"
	run_host_command_logged tar -xzf "$tarball" -C "$tmp_dir" || exit_with_error "Unable to unpack $tarball"

	# The tarball carries a single supervisor/ top-level directory.
	src="$tmp_dir/supervisor"
	[[ -x "$src/supervisor" ]] || exit_with_error "Supervisor binary missing from tarball" "$tarball"
	[[ -d "$src/config" ]] || exit_with_error "config/ tree missing from tarball" "$tarball"

	# --- 2. install everything shipped in the tarball ----------------------
	# Binary
	run_host_command_logged mkdir -p "$destination/usr/local/bin" || exit_with_error "Unable to mkdir /usr/local/bin"
	run_host_command_logged install -m 755 "$src/supervisor" \
		"$destination/usr/local/bin/supervisor" || exit_with_error "Unable to install supervisor binary"

	# systemd unit
	run_host_command_logged mkdir -p "$destination/etc/systemd/system" || exit_with_error "Unable to mkdir /etc/systemd/system"
	run_host_command_logged install -m 644 "$src/supervisor.service" \
		"$destination/etc/systemd/system/supervisor.service" || exit_with_error "Unable to install supervisor.service"

	# conf/ tree (zigbee2mqtt templates etc.)
	run_host_command_logged mkdir -p --mode=775 "$destination/var/lib/hubv3-supervisor" || exit_with_error "Unable to mkdir hubv3-supervisor"
	run_host_command_logged cp -r -v "$src/config/conf" \
		"$destination/var/lib/hubv3-supervisor/" || exit_with_error "Unable to copy supervisor conf directory"

	# Web UI
	run_host_command_logged mkdir -p "$destination/usr/share/hubv3-supervisor" || exit_with_error "Unable to mkdir /usr/share/hubv3-supervisor"
	run_host_command_logged cp -r -v "$src/config/static" \
		"$destination/usr/share/hubv3-supervisor/" || exit_with_error "Unable to copy supervisor static directory"

	# D-Bus policy
	run_host_command_logged mkdir -p "$destination/etc/dbus-1/system.d" || exit_with_error "Unable to mkdir /etc/dbus-1/system.d"
	run_host_command_logged install -m 644 "$src/config/dbus/com.thirdreality.linuxbox.Supervisor.conf" \
		"$destination/etc/dbus-1/system.d/" || exit_with_error "Unable to copy com.thirdreality.linuxbox.Supervisor.conf"

	# udev rules for the ThirdReality USB accessories (VID 31b6)
	run_host_command_logged mkdir -p "$destination/etc/udev/rules.d" || exit_with_error "Unable to mkdir /etc/udev/rules.d"
	run_host_command_logged install -m 644 "$src/config/udev/33-ama-usb.rules" \
		"$destination/etc/udev/rules.d/" || exit_with_error "Unable to copy 33-ama-usb.rules"

	# --- 3. board-specific configuration.yaml, installed last --------------
	# Each hardware variant keeps its own full copy: the GPIO pinout for LED /
	# button / zigbee / thread differs per board, as does
	# system_info.device_prefixes. Detection is by file presence, so adding a
	# variant means dropping in a file - no edit needed here. Installed after
	# the tarball contents so it always wins over the bundled default.
	local supervisor_conf
	if [[ -f "$board_conf" ]]; then
		supervisor_conf="$board_conf"
		display_alert "supervisor: board-specific configuration.yaml" "${BOARD}" "info"
	else
		supervisor_conf="$src/config/configuration.yaml"
		display_alert "supervisor: no board config, using the tarball default" "${BOARD}" "wrn"
	fi
	run_host_command_logged install -m 644 "$supervisor_conf" \
		"$destination/var/lib/hubv3-supervisor/configuration.yaml" || exit_with_error "Unable to install supervisor configuration.yaml"

	# --- 4. clean up -------------------------------------------------------
	run_host_command_logged rm -rf "$tmp_dir" || display_alert "Unable to remove temp dir" "$tmp_dir" "wrn"
}

